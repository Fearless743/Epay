name: Auto Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info
        id: get_tag
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          CURRENT_VER=$(echo "$CURRENT_TAG" | sed 's/^v//')
          echo "tag=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "current_ver=$CURRENT_VER" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "has_prev=false" >> $GITHUB_OUTPUT
          else
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "has_prev=true" >> $GITHUB_OUTPUT
          fi

      - name: Build full release archive
        run: |
          mkdir -p release_package
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.agents' \
                   --exclude='.codex' \
                   --exclude='.gitignore' \
                   --exclude='CLAUDE.md' \
                   --exclude='AGENTS.md' \
                   --exclude='config.php' \
                   --exclude='install/install.lock' \
                   --exclude='release_package' \
                   ./ release_package/Epay/
          cd release_package
          zip -r ../Epay-${{ steps.get_tag.outputs.tag }}.zip Epay/
          cd ..

      - name: Build incremental update archive
        if: steps.prev_tag.outputs.has_prev == 'true'
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          CURR_TAG="${{ steps.get_tag.outputs.tag }}"
          mkdir -p update_package/Epay

          # 获取上一个tag到当前tag之间变更的文件列表
          CHANGED_FILES=$(git diff --name-only "$PREV_TAG" "$CURR_TAG" | grep -v '^\.github/' | grep -v '^\.gitignore$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT

          # 复制变更文件到更新包
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              mkdir -p "update_package/Epay/$(dirname "$file")"
              cp "$file" "update_package/Epay/$file"
            fi
          done <<< "$CHANGED_FILES"

          cd update_package
          zip -r ../Epay-update-${{ steps.get_tag.outputs.tag }}.zip Epay/
          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          if [ -z "$LOG" ]; then
            LOG="- ${{ steps.get_tag.outputs.tag }} release"
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Release ${{ steps.get_tag.outputs.tag }}"
          body: |
            ## 更新日志
            ${{ steps.changelog.outputs.log }}

            ## 安装说明
            - 全新安装：下载 `Epay-${{ steps.get_tag.outputs.tag }}.zip` 解压部署
            - 已有用户：下载 `Epay-update-${{ steps.get_tag.outputs.tag }}.zip` 增量更新包覆盖，或通过管理后台「系统更新」功能自动升级

            ## 版本信息
            - 程序版本：`${{ steps.get_tag.outputs.current_ver }}`
            - 更新包：`Epay-${{ steps.get_tag.outputs.tag }}.zip`
          files: |
            Epay-${{ steps.get_tag.outputs.tag }}.zip
            Epay-update-${{ steps.get_tag.outputs.tag }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
